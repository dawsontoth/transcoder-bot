# transcoder-bot configuration
#
# Your copy lives at ~/.config/transcoder-bot/config.toml: create it with
# `transcoder-bot init-config` and edit that copy, not this example in the repo.
# It holds your tokens, so it's readable only by you.
# Only recordings_dir is required; every other value shown here is the default.
# Check your edits with `transcoder-bot doctor`.

# The folder your HyperDeck records into, as mounted on this Mac.
recordings_dir = "/Volumes/HyperDeck"

# Optional: if recordings_dir is missing (NAS not mounted), mount this share first.
# Uses the password saved in your Keychain when you connected in Finder.
# mount_url = "smb://nas.local/HyperDeck"

# Where the transcode is written before it's copied next to the source.
# Needs about 14 GB free per hour of footage at 25 Mbit/s. Empty = the system temp folder.
# temp_dir = ""

# ffmpeg/ffprobe to use. Found on PATH, in /opt/homebrew/bin or in /usr/local/bin by default.
# ffmpeg = "/opt/homebrew/bin/ffmpeg"
# ffprobe = "/opt/homebrew/bin/ffprobe"

[scan]
# Only recordings modified within this many hours are considered.
lookback_hours = 48
# Ignore files modified in the last few minutes (they may still be recording).
min_age_minutes = 5
extensions = [".mov", ".mp4", ".mxf"]

[video]
# "ccw" = 90° counter-clockwise, "cw" = 90° clockwise, "180" or "none".
rotate = "ccw"
# Downscale so the short side is at most this many pixels. Never upscales.
# 3840x2160 -> 1920x1080 -> rotated to 1080x1920.
short_side = 1080
# "libx264"           H.264 on the CPU: best quality per MB, most compatible (default).
# "h264_videotoolbox" H.264 on the Apple media engine: much faster. At a high bitrate like
#                     25M it looks nearly as good.
# "libx265" / "hevc_videotoolbox" for HEVC (smaller, but less universally supported).
encoder = "libx264"
# Average video bitrate. 25M (25 Mbit/s) makes a high-quality master for editing: about
# 8.5 GB per 45 minutes. Set it to "" to use constant quality (crf/vt_quality) instead.
bitrate = "25M"
# Constant quality, when bitrate is "": lower = better and bigger. 18-23 is sensible,
# and makes files a few GB per 45 minutes.
crf = 20
# libx264/libx265 speed vs. compression: faster presets make bigger files.
preset = "medium"
# VideoToolbox constant quality (1-100), when bitrate is "": higher = better and bigger.
vt_quality = 65
# "videotoolbox" decodes on the Apple media engine, leaving the CPU to the encoder.
hwaccel = ""
# Extra ffmpeg output arguments, appended verbatim, e.g. ["-g", "60"].
extra_args = []

[audio]
normalize = true
# EBU R128 two-pass loudness normalization targets.
# -16 LUFS suits phones, podcasts and social video. YouTube plays back at -14.
target_lufs = -16.0
true_peak = -1.5
# Loudness range. Recordings with a wider range than this get gentle dynamic
# processing instead of a single gain change.
lra = 11.0
# Which audio track to use (0 = the first).
stream = 0
# Which source channels to keep, counting from 1. [1, 2] = channels 1 and 2 as left and right.
# [1] = channel 1 on both sides (e.g. the only mic is plugged into channel 1).
# [3, 4] = channels 3 and 4 as left and right.
channels = [1, 2]
# Mix the selected channels into mono (played on both sides).
mono = false
bitrate = "192k"
sample_rate = 48000

[output]
# Service.mov -> Service_1080p.mp4, saved next to the source.
suffix = "_1080p"
extension = ".mp4"

[trash]
# What happens to recordings that weren't picked in the Slack poll:
#   "folder" moves them into a trash folder on the NAS (instant, and you can undo it).
#   "delete" deletes them permanently (your NAS's own recycle bin may still catch them).
mode = "folder"
# Relative to recordings_dir, or an absolute path on the same volume.
folder = "_Trash"
# Permanently delete trashed recordings after this many days. 0 = keep them forever.
retention_days = 7

[slack]
# Leave the tokens empty to read them from SLACK_BOT_TOKEN / SLACK_APP_TOKEN instead.
bot_token = ""  # xoxb-...  (OAuth & Permissions -> Bot User OAuth Token)
app_token = ""  # xapp-...  (Basic Information -> App-Level Tokens, scope connections:write)
# Channel ID, e.g. "C0123456789" (channel name -> About -> Channel ID, at the bottom).
channel = ""
# Give up after this long if nobody picks. Nothing is deleted when a poll times out.
poll_timeout_hours = 12
# Optional: member IDs of the people allowed to pick. Empty = anyone in the channel.
allowed_user_ids = []
# Post a message even when there's nothing new to pick from.
notify_when_empty = false
# How often to update the progress message while transcoding (seconds, 0 = off).
progress_update_seconds = 60

[descript]
# Upload each finished video to a new Descript project, ready for editing.
# Create a key in Descript: Settings -> API tokens -> Create token (it's tied to one Drive).
# Leave it empty to read DESCRIPT_API_KEY instead. No key anywhere = nothing is uploaded.
api_key = ""  # dx_bearer_...:dx_secret_...
# Project name: {stem} = the recording's file name, {date} = the day it was recorded.
project_name = "{date} {stem}"
# Optional folder in the Drive to put the projects in.
folder = ""
# Who else in the Drive can open the projects: "edit", "comment", "none",
# or "" for Descript's default.
team_access = ""
# Transcription language, e.g. "en". Empty = let Descript detect it.
language = ""
# How long to wait for Descript to finish importing a video before reporting back.
# 0 = don't wait.
wait_minutes = 60
